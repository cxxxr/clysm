# The tests of `make test-all`, each way of running tests/cases at the same
# time, and tools/check-defs.py (no function of the runtime defined twice).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a newer push to a pull request replaces its run; on main every push runs
# to its end, since a cancelled run makes a badge say "failing"
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compiled
            run: make test
          # (--thrown-exits: every non-local exit a Wasm exception)
          - name: compiled, exits thrown
            run: THROWN=1 tools/run-tests.sh && THROWN=1 tests/lib/run.sh
          - name: interpreted
            run: INTERP=1 tools/run-tests.sh
          - name: compiled at run time
            run: NATIVE=1 tools/run-tests.sh
          - name: self-hosted
            run: make selfhost && SELFHOST=1 tools/run-tests.sh && tests/lib/selfhost-names.sh && tests/lib/selfhost-same.sh
          # (with Binaryen, for --wasm-opt: tests/lib/run.sh skips that of it otherwise)
          - name: library, ASDF, linked heap image, fasls across images, definitions
            binaryen: true
            run: tools/check-defs.py && make test-lib test-asdf test-link test-fasl-images
          # modules through wasm-opt (tools/wasm-opt.mjs): shaken, and every
          # fourth file, since the wasm-opt of the npm package takes 40 s of
          # a processor for a shaken module (all of them, and not shaken:
          # WASM_OPT=1 tools/run-tests.sh, an hour and a half of a processor
          # and more); without the three files that need what --shake leaves
          # out (they fail with SHAKE=1 alone)
          - name: compiled and shaken, through wasm-opt
            binaryen: true
            run: SHAKE=1 WASM_OPT=1 tools/run-tests.sh $(ls tests/cases/*.lisp | grep -v -e big-structs -e load-batch-ahead -e many-packages | awk 'NR % 4 == 1')
          # the README says Node.js 22 runs everything but JS:AWAIT (and so
          # threads and the npm package), which needs Node.js 24
          - name: compiled, Node.js 22
            node: 22
            run: tools/run-tests.sh $(ls tests/cases/*.lisp | grep -v js-async) && make test-asdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node || 24 }}
      - uses: ./.github/actions/sbcl
      # (where a project that has Clysm as a package has it: tools/wasm-opt.mjs finds it from there)
      - name: Install Binaryen
        if: matrix.binaryen
        run: npm install --no-save --no-package-lock --no-audit --no-fund binaryen@132.0.0
      - name: Run
        run: ${{ matrix.run }}
      - name: Show the differences
        if: failure()
        run: |
          for f in build/tests/*.out; do
            [ -f "$f" ] || continue
            n=${f%.out}
            cmp -s "$n.exp" "$f" || { echo "== $(basename "$n")"; diff "$n.exp" "$f" | head -20; tail -5 "$n.err" 2>/dev/null; }
          done
