<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lem</title>
<link rel="stylesheet" href="lem.css">
</head>
<body>
<div id="status">Loading Lem…</div>
<div id="lem"></div>
<script type="module">
  import { loadClysm } from './clysm.mjs';
  const status = document.getElementById('status');
  // the output of Lisp goes to the console, line by line
  const pending = { 1: '', 2: '' };
  const output = (text, fd) => {
    const lines = (pending[fd] + text).split('\n');
    pending[fd] = lines.pop();
    for (const line of lines) (fd === 2 ? console.error : console.log)(line);
  };
  try {
    const bytes = await (await fetch('lem.wasm')).arrayBuffer();
    await new Promise((resolve) => setTimeout(resolve, 0));   // show the status first
    // (lisp.eval(string) evaluates Lisp forms, e.g. from the developer tools)
    window.lisp = await loadClysm(bytes, output, {
      fs: require('node:fs'),
      root: '@CLYSM_ROOT@/',
      args: ['@APP_DIR@/boot.lisp'],
    });
    status.remove();
  } catch (e) {
    status.textContent = 'Lem could not start:\n' + (e && e.message);
    throw e;
  }
</script>
</body>
</html>
