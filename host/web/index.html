<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clysm REPL</title>
<style>
  :root { --bg: #fbfaf7; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e1db; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17181a; --fg: #e8e6e1; --muted: #9a9a9f; --line: #33343a; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 920px; height: 100%; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  header p { color: var(--muted); font-size: 13px; margin: 0; flex: 1; }
  header button { font: inherit; font-size: 13px; color: var(--muted); background: none; cursor: pointer;
                  border: 1px solid var(--line); border-radius: 6px; padding: 2px 10px; }
  header button:hover { color: var(--fg); }
  #term { flex: 1; min-height: 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Clysm REPL</h1>
    <p>Common Lisp on WebAssembly GC — each form is compiled to WebAssembly in your browser.</p>
    <button id="clear" title="Ctrl+L">Clear</button>
  </header>
  <div id="term"></div>
</main>
<script type="module">
  import { loadClysm } from './clysm.mjs';
  import { createRepl } from './repl.mjs';
  const repl = createRepl(document.getElementById('term'));
  document.getElementById('clear').addEventListener('click', repl.clear);
  repl.info('Loading…\n');
  try {
    const bytes = await (await fetch('clysm.wasm')).arrayBuffer();
    const lisp = await loadClysm(bytes, repl.write, { readLine: repl.readLine });
    repl.clear();
    repl.info('Enter evaluates, Shift+Enter starts a new line, ↑/↓ recall history, Ctrl+L clears.\n');
    repl.start(lisp);
  } catch (e) {
    repl.error(`Could not start Clysm: ${e.message}\n`);
  }
</script>
</body>
</html>
