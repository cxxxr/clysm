<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clysm TODO</title>
<style>
  :root { --bg: #f6f4ef; --fg: #1d1d1f; --muted: #75736d; --accent: #2f5d8a; --panel: #ffffff;
          --line: #e3e0d8; --done: #a9a69e; --danger: #b8433a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151618; --fg: #e8e6e1; --muted: #9a9a9f; --accent: #7fb0e0; --panel: #1f2023;
            --line: #33343a; --done: #66666c; --danger: #e07a70; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: .02em; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
          box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04); }
  .entry { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .entry input[type=text] { flex: 1; border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; }
  .entry input[type=text]::placeholder { color: var(--muted); }
  input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; flex: none; }
  ul { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .item .text { flex: 1; overflow-wrap: anywhere; cursor: text; }
  .item.done .text { color: var(--done); text-decoration: line-through; }
  .item .edit { flex: 1; font: inherit; color: var(--fg); background: var(--bg);
                border: 1px solid var(--accent); border-radius: 6px; padding: 2px 8px; outline: 0; }
  .delete { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1;
            padding: 0 4px; cursor: pointer; opacity: 0; transition: opacity .15s; }
  .item:hover .delete, .delete:focus-visible { opacity: 1; }
  .delete:hover { color: var(--danger); }
  @media (hover: none) { .delete { opacity: 1; } }
  #empty { color: var(--muted); text-align: center; padding: 28px 16px; margin: 0; border-bottom: 1px solid var(--line); }
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px;
           color: var(--muted); font-size: 13px; }
  #count { margin-right: auto; }
  #filters { display: flex; gap: 4px; }
  footer button { font: inherit; color: var(--muted); background: none; border: 1px solid transparent;
                  border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  footer button:hover { color: var(--fg); }
  .filter.selected { border-color: var(--line); color: var(--fg); }
  #clear:hover { color: var(--danger); }
  .note { color: var(--muted); font-size: 12px; margin-top: 16px; text-align: center; }
  #status { color: var(--muted); padding: 14px 16px; }
</style>
</head>
<body>
<main>
  <h1>TODO</h1>
  <p class="sub">Common Lisp → WebAssembly GC (Clysm) で動いています</p>
  <div class="card">
    <div class="entry">
      <input type="checkbox" id="toggle-all" title="すべて完了/未完了にする">
      <input type="text" id="new" placeholder="やることを入力して Enter" autocomplete="off" autofocus>
    </div>
    <div id="status">読み込み中…</div>
    <ul id="list"></ul>
    <p id="empty" hidden></p>
    <footer id="footer" hidden>
      <span id="count"></span>
      <span id="filters"></span>
      <button id="clear" hidden>完了済みを削除</button>
    </footer>
  </div>
  <p class="note">ダブルクリックで編集 ・ データはブラウザの localStorage に保存されます</p>
</main>
<script type="module">
  import { loadClysm } from './clysm.mjs';
  const status = document.getElementById('status');
  try {
    const bytes = await (await fetch('todo.wasm')).arrayBuffer();
    // Lisp output (PRINT, errors) goes to the console
    await loadClysm(bytes, (text) => console.log(text));
    status.remove();
  } catch (e) {
    status.textContent = 'エラー: ' + e.message;
    throw e;
  }
</script>
</body>
</html>
